<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPT 棉花娃娃换装屋</title>
<style>
:root {
  --sage: #b8c9b0;
  --sage-dark: #7a9a6e;
  --text-primary: #4a3f3a;
  --text-secondary: #8a7e78;
  --text-hint: #b0a8a2;
  --panel-bg: rgba(255, 252, 248, 0.96);
  --panel-border: rgba(200, 180, 170, 0.3);
  --shadow-soft: 0 4px 24px rgba(140, 110, 100, 0.10);
  --shadow-medium: 0 8px 32px rgba(140, 110, 100, 0.14);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  overflow: hidden;
  font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
  background: #f0e8e0;
  color: var(--text-primary);
  user-select: none;
}
canvas { display: block; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(180deg, rgba(253, 248, 243, 0.95) 0%, rgba(253, 248, 243, 0.0) 100%);
  z-index: 200; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#game-title {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  letter-spacing: 1.5px; display: flex; align-items: center; gap: 6px;
}
#top-actions { display: flex; gap: 6px; }
.top-btn {
  padding: 7px 14px; border-radius: 20px;
  border: 1.5px solid var(--panel-border);
  background: var(--panel-bg); backdrop-filter: blur(12px);
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.top-btn:hover {
  background: #fff; border-color: var(--sage);
  color: var(--sage-dark); box-shadow: var(--shadow-soft);
}
.top-btn:active { transform: scale(0.96); }
.top-btn.accent {
  background: linear-gradient(135deg, var(--sage), var(--sage-dark));
  color: #fff; border-color: transparent;
}

#panel {
  position: fixed; top: 64px; left: 16px; width: 300px;
  height: calc(100vh - 80px);
  max-height: 720px;
  background: var(--panel-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-medium);
  border: 1px solid var(--panel-border);
  z-index: 150; display: flex; flex-direction: column; overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
}
#panel.hidden { transform: translateX(-120%); opacity: 0; pointer-events: none; }

/* 面板右上角折叠按钮 */
#panel-collapse {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: rgba(200, 180, 170, 0.18);
  color: var(--text-hint);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: var(--transition);
  line-height: 1;
  padding-bottom: 2px;
}
#panel-collapse:hover {
  background: rgba(200, 180, 170, 0.4);
  color: var(--text-secondary);
}
#panel-collapse:active { transform: scale(0.92); }

#category-tabs {
  display: flex; flex-shrink: 0; overflow-x: auto;
  padding: 10px 42px 6px 10px;
  gap: 4px;
  scrollbar-width: thin;
  border-bottom: 1px solid rgba(200, 180, 170, 0.15);
  background: rgba(255, 252, 248, 0.5);
}
#category-tabs::-webkit-scrollbar { height: 3px; }
#category-tabs::-webkit-scrollbar-thumb { background: rgba(200, 180, 170, 0.4); border-radius: 3px; }

.cat-tab {
  padding: 7px 12px; border-radius: 12px; border: none;
  background: transparent; font-size: 11.5px; font-weight: 600;
  color: var(--text-hint); cursor: pointer; transition: var(--transition);
  white-space: nowrap; display: flex; align-items: center; gap: 3px;
  flex-shrink: 0;
}
.cat-tab:hover { background: rgba(200, 180, 170, 0.12); color: var(--text-secondary); }
.cat-tab.active {
  background: linear-gradient(135deg, #f0ece6, #e8e0d8);
  color: var(--text-primary);
  box-shadow: 0 2px 8px rgba(140, 110, 100, 0.10);
}
.cat-tab .tab-icon { font-size: 14px; }

#item-area {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px;
  min-height: 0;
  scrollbar-width: thin; scrollbar-color: rgba(200, 180, 170, 0.4) transparent;
}
#item-area::-webkit-scrollbar { width: 4px; }
#item-area::-webkit-scrollbar-track { background: transparent; }
#item-area::-webkit-scrollbar-thumb { background: rgba(200, 180, 170, 0.4); border-radius: 4px; }

.item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px 8px; border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  background: rgba(255, 255, 255, 0.6);
  cursor: pointer; transition: var(--transition); position: relative;
}
.item-card:hover {
  background: #fff; border-color: rgba(184, 201, 176, 0.4);
  box-shadow: 0 2px 12px rgba(140, 110, 100, 0.08);
  transform: translateY(-1px);
}
.item-card.active {
  background: linear-gradient(135deg, #edf3ea, #e2ecd8);
  border-color: var(--sage);
  box-shadow: 0 2px 12px rgba(122, 154, 110, 0.18);
}
.item-card.active::after {
  content: '✓'; position: absolute; top: 3px; right: 5px;
  font-size: 9px; color: var(--sage-dark); font-weight: 700;
}
.item-card .item-icon { font-size: 22px; line-height: 1; }
.item-card .item-name {
  font-size: 9.5px; color: var(--text-hint);
  font-weight: 600; text-align: center; line-height: 1.2;
}

.color-section { margin-bottom: 16px; }
.color-section:last-child { margin-bottom: 0; }
.color-label {
  font-size: 11px; font-weight: 700; color: var(--text-hint);
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  letter-spacing: 0.5px;
}
.color-label::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--sage);
}
.color-swatches { display: flex; flex-wrap: wrap; gap: 7px; }
.color-swatch {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent; transition: var(--transition);
  box-shadow: 0 1px 4px rgba(0,0,0,0.10); position: relative;
}
.color-swatch:hover { transform: scale(1.12); }
.color-swatch.active {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--sage);
  transform: scale(1.08);
}
.color-swatch.disabled {
  background: #fff !important;
  border: 2.5px dashed #d8d0c8;
}
.color-swatch.disabled::after {
  content: '✕'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: #d8d0c8; font-size: 12px; font-weight: 700;
}

.custom-color-row {
  display: flex; align-items: center; gap: 8px; margin-top: 8px;
}
.custom-color-row input[type="color"] {
  width: 32px; height: 32px;
  border: 2px solid var(--panel-border);
  border-radius: 50%; cursor: pointer; padding: 0;
  background: none; overflow: hidden;
}
.custom-color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.custom-color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
.custom-color-row span { font-size: 10px; color: var(--text-hint); font-weight: 600; }

.scale-control {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 4px 6px; margin-top: 10px;
  border-top: 1px dashed rgba(200, 180, 170, 0.4);
}
.scale-label {
  font-size: 11px; color: var(--text-hint); font-weight: 700;
  white-space: nowrap; letter-spacing: 0.5px;
}
.scale-slider {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, #e0d8d0, #d8e0cc);
  outline: none; cursor: pointer;
}
.scale-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, #b8c9b0, #7a9a6e);
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(122, 154, 110, 0.4);
  cursor: pointer; transition: var(--transition);
}
.scale-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
.scale-slider::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, #b8c9b0, #7a9a6e);
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(122, 154, 110, 0.4);
  cursor: pointer;
}
.scale-value {
  font-size: 11px; color: var(--text-secondary); font-weight: 700;
  min-width: 34px; text-align: right;
  font-variant-numeric: tabular-nums;
}

#bottombar {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px;
  background: var(--panel-bg); backdrop-filter: blur(16px);
  border-radius: 24px; box-shadow: var(--shadow-soft);
  border: 1px solid var(--panel-border);
  z-index: 150; font-size: 11px; color: var(--text-hint);
  font-weight: 600; white-space: nowrap;
}

/* 展开按钮（面板收起时显示） */
#toggle-panel {
  position: fixed;
  top: 64px;
  left: 16px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow-medium);
  font-size: 18px;
  cursor: pointer;
  z-index: 160;
  display: none;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
#toggle-panel.visible { display: flex; }
#toggle-panel:hover { transform: scale(1.08); }
#toggle-panel:active { transform: scale(0.95); }

#loading {
  position: fixed; inset: 0; background: #fdf8f3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; transition: opacity 0.5s; gap: 16px;
}
#loading.done { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid #e8e0d8; border-top-color: var(--sage-dark);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-size: 13px; color: var(--text-hint);
  font-weight: 600; letter-spacing: 1px;
}

@media (max-width: 820px) {
  #panel {
    top: auto; bottom: 78px; left: 12px; right: 12px;
    width: auto; height: auto; max-height: 50vh;
    border-radius: var(--radius-md);
  }
  #panel.hidden { transform: translateY(120%); opacity: 0; }

  #toggle-panel {
    top: auto;
    bottom: 20px;
    left: 16px;
  }

  #top-actions .top-btn .btn-text { display: none; }
  #top-actions .top-btn { padding: 7px 10px; }
  #game-title { font-size: 13px; }
  #bottombar { display: none; }
}
@media (max-width: 480px) {
  .item-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .item-card { padding: 8px 3px 6px; }
  .item-card .item-name { font-size: 8.5px; }
  .color-swatch { width: 24px; height: 24px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在准备娃娃屋...</div>
</div>

<div id="topbar">
  <div id="game-title"><span class="emoji">🧸</span> 棉花娃娃换装屋</div>
  <div id="top-actions">
    <button class="top-btn" id="btn-random" title="随机搭配">
      <span>🎲</span><span class="btn-text">随机</span>
    </button>
    <button class="top-btn" id="btn-reset" title="重置造型">
      <span>↺</span><span class="btn-text">重置</span>
    </button>
    <button class="top-btn accent" id="btn-save" title="保存搭配">
      <span>💾</span><span class="btn-text">保存</span>
    </button>
  </div>
</div>

<div id="panel">
  <button id="panel-collapse" title="收起面板">‹</button>
  <div id="category-tabs"></div>
  <div id="item-area"></div>
</div>

<button id="toggle-panel" title="打开换装面板">🎨</button>

<div id="bottombar">
  <span class="hint-icon">🖱️</span> 拖拽旋转 · 滚轮缩放 · 右键平移
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. 场景 / 相机 / 渲染器
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0e8e0);
scene.fog = new THREE.Fog(0xf0e8e0, 18, 34);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(3, 1, 9.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ============================================================
   2. 光照
   ============================================================ */
scene.add(new THREE.AmbientLight(0xfff5ee, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.15);
keyLight.position.set(5, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xe0d8f0, 0.45);
fillLight.position.set(-5, 4, -3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffddee, 0.5, 14);
rimLight.position.set(-3, 3, -5);
scene.add(rimLight);

const warmGlow = new THREE.PointLight(0xffccaa, 0.35, 10);
warmGlow.position.set(2, 0.5, 3);
scene.add(warmGlow);

/* ============================================================
   3. 房间
   ============================================================ */
const roomGroup = new THREE.Group();
scene.add(roomGroup);

const roomMats = {
  wall: new THREE.MeshStandardMaterial({ color: 0xfff6f0, roughness: 0.92 }),
  floor: new THREE.MeshStandardMaterial({ color: 0xf0dcc8, roughness: 0.85 }),
  rug: new THREE.MeshStandardMaterial({ color: 0xf5e0d8, roughness: 1.0 }),
  rugInner: new THREE.MeshStandardMaterial({ color: 0xfef0ea, roughness: 1.0 }),
  shelf: new THREE.MeshStandardMaterial({ color: 0xd4b898, roughness: 0.75 }),
  bedFrame: new THREE.MeshStandardMaterial({ color: 0xe8c8a8, roughness: 0.8 }),
  bedSheet: new THREE.MeshStandardMaterial({ color: 0xfdf0e8, roughness: 0.95 }),
  pillow: new THREE.MeshStandardMaterial({ color: 0xfff8f2, roughness: 0.98 }),
  wood: new THREE.MeshStandardMaterial({ color: 0xc8a888, roughness: 0.78 }),
};

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 14), roomMats.wall);
backWall.position.set(0, 2.5, -7.15);
backWall.receiveShadow = true;
roomGroup.add(backWall);

const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 14), roomMats.wall);
leftWall.position.set(-10, 2.5, 0.5);
leftWall.rotation.y = Math.PI / 2;
leftWall.receiveShadow = true;
roomGroup.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 14), roomMats.wall);
rightWall.position.set(10, 2.5, 0.5);
rightWall.rotation.y = -Math.PI / 2;
rightWall.receiveShadow = true;
roomGroup.add(rightWall);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 16), roomMats.floor);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -2.8, 0.5);
floor.receiveShadow = true;
roomGroup.add(floor);

const baseBoard = new THREE.Mesh(new THREE.BoxGeometry(20, 0.15, 0.08),
  new THREE.MeshStandardMaterial({ color: 0xf8f0e8, roughness: 0.7 }));
baseBoard.position.set(0, -2.72, -7.11);
roomGroup.add(baseBoard);

const rug = new THREE.Mesh(new THREE.CircleGeometry(3.6, 48), roomMats.rug);
rug.rotation.x = -Math.PI / 2;
rug.position.set(0.5, -2.78, 0.8);
rug.receiveShadow = true;
roomGroup.add(rug);

const rugInner = new THREE.Mesh(new THREE.CircleGeometry(2.0, 32), roomMats.rugInner);
rugInner.rotation.x = -Math.PI / 2;
rugInner.position.set(0.5, -2.77, 0.8);
roomGroup.add(rugInner);

/* 窗户 */
let windowClouds = [];
(function createWindow() {
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xfffaf5, roughness: 0.6 });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0xd8eeff, roughness: 0.1, metalness: 0.05,
    transparent: true, opacity: 0.35, depthWrite: false
  });
  const skyMat = new THREE.MeshBasicMaterial({ color: 0xc8e4f8, depthWrite: false });
  const cloudMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false
  });

  const W = 3.6, H = 2.8, T = 0.14;
  [[0, H/2, W, T], [0, -H/2, W, T], [-W/2, 0, T, H], [W/2, 0, T, H]].forEach(([x, y, w, h]) => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), frameMat);
    bar.position.set(x, y, 0);
    bar.castShadow = true;
    g.add(bar);
  });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(W - 0.1, 0.07, 0.06), frameMat));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07, H - 0.1, 0.06), frameMat));

  const sky = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.25, H - 0.25), skyMat);
  sky.position.z = -0.035;
  sky.renderOrder = 1;
  g.add(sky);

  [[-0.8, 0.6, 0.45], [0.6, 0.3, 0.35], [-0.2, -0.4, 0.4], [0.9, -0.2, 0.28]].forEach(([cx, cy, cr]) => {
    const cloud = new THREE.Mesh(new THREE.CircleGeometry(cr, 16), cloudMat);
    cloud.position.set(cx, cy, -0.02);
    cloud.userData.baseX = cx;
    cloud.renderOrder = 2;
    g.add(cloud);
    windowClouds.push(cloud);
  });

  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.2, H - 0.2), glassMat);
  glass.position.z = 0.05;
  glass.renderOrder = 3;
  g.add(glass);

  g.position.set(0, 2.8, -7.0);
  roomGroup.add(g);
})();

/* 窗帘 */
const curtainMat = new THREE.MeshStandardMaterial({
  color: 0xf5e8e0, roughness: 0.95, side: THREE.DoubleSide,
  transparent: true, opacity: 0.75
});
const curtains = [];
[-1.95, 1.95].forEach(x => {
  const curtain = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 3.2, 6, 8), curtainMat);
  curtain.position.set(x, 2.6, -6.9);
  curtain.rotation.y = x > 0 ? -0.15 : 0.15;
  curtain.userData.baseRotY = x > 0 ? -0.15 : 0.15;
  curtains.push(curtain);
  roomGroup.add(curtain);
});

/* 小床 */
(function createBed() {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 3.2), roomMats.bedFrame);
  frame.position.set(0, 0.35, 0);
  frame.castShadow = true;
  frame.receiveShadow = true;
  g.add(frame);

  const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.25, 3.0), roomMats.bedSheet);
  mattress.position.set(0, 0.62, 0);
  mattress.castShadow = true;
  g.add(mattress);

  const quilt = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.18, 1.8), roomMats.pillow);
  quilt.position.set(0, 0.78, 0.5);
  quilt.castShadow = true;
  g.add(quilt);

  const pillow = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), roomMats.pillow);
  pillow.scale.set(1, 0.4, 0.6);
  pillow.position.set(0, 0.82, -1.0);
  pillow.castShadow = true;
  g.add(pillow);

  const headboard = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.0, 0.2), roomMats.bedFrame);
  headboard.position.set(0, 0.9, -1.55);
  headboard.castShadow = true;
  g.add(headboard);

  [[-1.2, -1.4], [1.2, -1.4], [-1.2, 1.4], [1.2, 1.4]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.35, 8), roomMats.wood);
    leg.position.set(lx, 0.18, lz);
    leg.castShadow = true;
    g.add(leg);
  });

function buildLogoGeometry(halfSize) {
  const tH = Math.min(halfSize, 1.15);
  const uM = Math.asin(Math.min(tH / Rx, 0.99));
  const vM = Math.asin(Math.min(tH / Ry, 0.99));
  const sU = 48, sV = 48;
  const verts = [], uvs = [], norms = [], idx = [];
  const off = 0.02;

  for (let j = 0; j <= sV; j++) {
    const v = -vM + (j / sV) * 2 * vM;
    for (let i = 0; i <= sU; i++) {
      const u = -uM + (i / sU) * 2 * uM;
      const xU = Math.sin(u) * Math.cos(v);
      const yU = Math.sin(v);
      const zU = Math.cos(u) * Math.cos(v);
      const px = Rx * xU, py = Ry * yU, pz = Rz * zU;
      let nx = xU / Rx, ny = yU / Ry, nz = zU / Rz;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= nl; ny /= nl; nz /= nl;
      verts.push(px + nx * off, py + ny * off, pz + nz * off);
      norms.push(nx, ny, nz);
      uvs.push(i / sU, j / sV);
    }
  }
  for (let j = 0; j < sV; j++) {
    for (let i = 0; i < sU; i++) {
      const a = j * (sU + 1) + i;
      const b = a + 1;
      const c = (j + 1) * (sU + 1) + i;
      const d = c + 1;
      idx.push(a, b, d, a, d, c);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
}

function makeEarPair(config) {
  const { topColor, innerColor, sideX, sideY, sideZ, rotZ, rotX, coneR, coneH, innerR, innerH, innerZOff } = config;
  const g = new THREE.Group();
  const topMat = new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.82 });
  const innerMat = new THREE.MeshStandardMaterial({ color: innerColor, roughness: 0.88 });

  [-1, 1].forEach(side => {
    const earGroup = new THREE.Group();
    earGroup.position.set(side * sideX, sideY, sideZ);
    earGroup.rotation.z = side * rotZ;
    if (rotX) earGroup.rotation.x = rotX;
    earGroup.userData.scaleRoot = true;

    const outerGeo = new THREE.ConeGeometry(coneR, coneH, 16);
    outerGeo.translate(0, coneH / 2, 0);
    const outer = new THREE.Mesh(outerGeo, topMat);
    outer.castShadow = true;
    earGroup.add(outer);

    const innerGeo = new THREE.ConeGeometry(innerR, innerH, 12);
    innerGeo.translate(0, innerH / 2, innerZOff);
    const inner = new THREE.Mesh(innerGeo, innerMat);
    earGroup.add(inner);

    g.add(earGroup);
  });
  return g;
}

function createBadge() {
  const g = makeChestRoot();
  const mat = new THREE.MeshStandardMaterial({ color: 0x60a8e8, roughness: 0.5, metalness: 0.3 });
  const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.02, 12), mat);
  badge.position.set(0.3, -0.05, 0.15);
  badge.rotation.x = Math.PI / 2;
  g.add(badge);
  return g;
}

function createPearlNecklace() {
  const g = makeChestRoot();
  const mat = new THREE.MeshStandardMaterial({ color: 0xfff8f0, roughness: 0.2, metalness: 0.1 });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), mat);
    pearl.position.set(Math.cos(a) * 0.58, 0.05 + Math.sin(a) * 0.1, Math.sin(a) * 0.58);
    g.add(pearl);
  }
  return g;
}

function createPendant() {
  const g = makeChestRoot();
  const chainMat = new THREE.MeshStandardMaterial({ color: 0xd8c8a8, roughness: 0.5, metalness: 0.4 });
  const pendMat = new THREE.MeshStandardMaterial({ color: 0xe8d060, roughness: 0.4, metalness: 0.4 });
  const chain = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.02, 6, 24), chainMat);
  chain.position.y = 0.07;
  chain.rotation.x = Math.PI / 2;
  g.add(chain);
  const pend = new THREE.Mesh(new THREE.OctahedronGeometry(0.09), pendMat);
  pend.position.set(0, -0.1, 0.05);

  return g;
}

function createWings() {
  const g = new THREE.Group();
  g.position.set(0, -0.4, -0.4);
  g.userData.scaleRoot = true;

    color: 0xfff8f0, roughness: 0.8, transparent: true, opacity: 0.75, side: THREE.DoubleSide
  });

    const wing = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), mat);
    wing.scale.set(0.8, 0.5, 0.15);
    wing.position.set(side * 1.0, 0, -0.1);
    wing.rotation.z = side * -0.4;
    wing.rotation.y = side * -0.3;
    g.add(wing);
  });
  return g;
}

function createHalo() {

function createGlasses() {

const accessoryInstances = {};
const activeAccessoryGroups = {};

function applyScaleToGroup(rootGroup, scale) {
  if (rootGroup.userData.scaleRoot) {
    rootGroup.scale.set(scale, scale, scale);
    return;
  }
  let found = false;
  rootGroup.traverse(child => {
    if (child.userData.scaleRoot) {
      child.scale.set(scale, scale, scale);
      found = true;
    }
  });
  if (!found) {
    rootGroup.scale.set(scale, scale, scale);
  }
}

function createAccessory(itemId, categoryId) {
  if (accessoryInstances[itemId]) return accessoryInstances[itemId];
  const factory = accessoryFactories[itemId];
  if (!factory) return null;

  const group = factory();
  group.visible = false;

  const scale = state.accessoryScales[categoryId] || 1;
  applyScaleToGroup(group, scale);

  dollGroup.add(group);
  accessoryInstances[itemId] = group;
  return group;
}

function setAccessoryScale(categoryId, scale) {
  state.accessoryScales[categoryId] = scale;
  const cat = ACCESSORY_CATEGORIES.find(c => c.id === categoryId);
  if (cat && cat.items) {
    cat.items.forEach(item => {
      const group = accessoryInstances[item.id];
      if (group) applyScaleToGroup(group, scale);
    });
  }
}

function toggleAccessory(categoryId, itemId) {
  const current = state.activeAccessories[categoryId];

  if (current === itemId) {
    if (activeAccessoryGroups[categoryId]) {
      activeAccessoryGroups[categoryId].visible = false;
    }
    delete state.activeAccessories[categoryId];
    delete activeAccessoryGroups[categoryId];
    return;
  }

  if (activeAccessoryGroups[categoryId]) {
    activeAccessoryGroups[categoryId].visible = false;
  }

  if (categoryId === 'hats' && state.activeAccessories['plants']) {
    const pg = activeAccessoryGroups['plants'];
    if (pg) pg.visible = false;
    delete state.activeAccessories['plants'];
    delete activeAccessoryGroups['plants'];
  }
  if (categoryId === 'plants' && state.activeAccessories['hats']) {
    const hg = activeAccessoryGroups['hats'];
    if (hg) hg.visible = false;
    delete state.activeAccessories['hats'];
    delete activeAccessoryGroups['hats'];
  }

  const group = createAccessory(itemId, categoryId);
  if (group) {
    group.visible = true;
    state.activeAccessories[categoryId] = itemId;
    activeAccessoryGroups[categoryId] = group;
  }
}

function clearAllAccessories() {
  Object.keys(activeAccessoryGroups).forEach(catId => {
    if (activeAccessoryGroups[catId]) {
      activeAccessoryGroups[catId].visible = false;
    }
  });
  Object.keys(state.activeAccessories).forEach(k => delete state.activeAccessories[k]);
  Object.keys(activeAccessoryGroups).forEach(k => delete activeAccessoryGroups[k]);
}

const categoryTabs = document.getElementById('category-tabs');

function buildCategoryTabs() {
  categoryTabs.innerHTML = '';
  ACCESSORY_CATEGORIES.forEach(cat => {
    const tab = document.createElement('button');
    tab.className = 'cat-tab' + (cat.id === activeCategory ? ' active' : '');
    tab.dataset.cat = cat.id;
    tab.innerHTML = `<span class="tab-icon">${cat.icon}</span>${cat.name}`;
    tab.addEventListener('click', () => {
      activeCategory = cat.id;
      buildCategoryTabs();
      renderItemArea();
    });
    categoryTabs.appendChild(tab);
  });
}

function renderItemArea() {
  itemArea.innerHTML = '';
  const cat = ACCESSORY_CATEGORIES.find(c => c.id === activeCategory);
  if (!cat) return;

  if (cat.type === 'color') renderColorPanel();
  else if (cat.type === 'logo') renderLogoPanel();
  else if (cat.items) renderAccessoryGrid(cat);
}

function renderColorPanel() {
  const sec = { label: '身体颜色', presets: COLOR_PRESETS.skin, current: state.skinColor,

  div.appendChild(label);

  const swatches = document.createElement('div');
  swatches.className = 'color-swatches';

  sec.presets.forEach(p => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (p.color === sec.current ? ' active' : '');
    swatch.style.background = '#' + p.color.toString(16).padStart(6, '0');
    swatch.title = p.name;
    swatch.addEventListener('click', () => {
      sec.setter(p.color);
      swatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
    });

  customRow.className = 'custom-color-row';
  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.value = '#' + sec.current.toString(16).padStart(6, '0');
  colorInput.addEventListener('input', (e) => {
    const hex = parseInt(e.target.value.replace('#', ''), 16);
    sec.setter(hex);
    swatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  });
  customRow.appendChild(colorInput);
  const span = document.createElement('span');
  span.textContent = '自定义';
  customRow.appendChild(span);
  div.appendChild(customRow);

  itemArea.appendChild(div);

  const blushSection = document.createElement('div');
  blushSection.className = 'color-section';

  const blushLabel = document.createElement('div');
  blushLabel.className = 'color-label';
  blushLabel.textContent = '腮红';
  blushSection.appendChild(blushLabel);

  const blushSwatches = document.createElement('div');
  blushSwatches.className = 'color-swatches';

  COLOR_PRESETS.blush.forEach(p => {
    const swatch = document.createElement('div');
    const isActive = p.color === null ? !state.blushEnabled : (state.blushEnabled && p.color === state.blushColor);
    swatch.className = 'color-swatch' + (isActive ? ' active' : '') + (p.color === null ? ' disabled' : '');
    if (p.color !== null) swatch.style.background = '#' + p.color.toString(16).padStart(6, '0');
    swatch.title = p.name;
    swatch.addEventListener('click', () => {
      if (p.color === null) {
        state.blushEnabled = false;
        blushMeshes.forEach(b => b.visible = false);
      } else {
        state.blushEnabled = true;
        state.blushColor = p.color;
        matBlush.color.setHex(p.color);
        blushMeshes.forEach(b => b.visible = true);
      }
      blushSwatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
    });
    blushSwatches.appendChild(swatch);
  });

  blushSection.appendChild(blushSwatches);

  const blushCustom = document.createElement('div');
  blushCustom.className = 'custom-color-row';
  const blushColorInput = document.createElement('input');
  blushColorInput.type = 'color';
  blushColorInput.value = '#' + state.blushColor.toString(16).padStart(6, '0');
  blushColorInput.addEventListener('input', (e) => {
    const hex = parseInt(e.target.value.replace('#', ''), 16);

    state.blushEnabled = true;

    blushMeshes.forEach(b => b.visible = true);
    blushSwatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));

  const blushSpan = document.createElement('span');
  blushSpan.textContent = '自定义';
  blushCustom.appendChild(blushSpan);
  blushSection.appendChild(blushCustom);

  itemArea.appendChild(blushSection);

function renderLogoPanel() {
  const div = document.createElement('div');
  div.className = 'color-section';

  const label = document.createElement('div');
  label.className = 'color-label';
  label.textContent = 'Logo 颜色';
  div.appendChild(label);

  const swatches = document.createElement('div');
  swatches.className = 'color-swatches';

  COLOR_PRESETS.logo.forEach(p => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (p.color === state.logoColor ? ' active' : '');
    swatch.style.background = p.color;
    swatch.title = p.name;
    swatch.addEventListener('click', () => {
      state.logoColor = p.color;
      matLogo.map = createLogoTexture(p.color);
      matLogo.needsUpdate = true;
      swatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
    });
    swatches.appendChild(swatch);
  });

  div.appendChild(swatches);

  const customRow = document.createElement('div');
  customRow.className = 'custom-color-row';
  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.value = state.logoColor;
  colorInput.addEventListener('input', (e) => {
    state.logoColor = e.target.value;
    matLogo.map = createLogoTexture(e.target.value);
    matLogo.needsUpdate = true;
    swatches.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  });
  customRow.appendChild(colorInput);
  const span = document.createElement('span');
  span.textContent = '自定义';
  customRow.appendChild(span);
  div.appendChild(customRow);

  const scaleDiv = document.createElement('div');
  scaleDiv.className = 'scale-control';

  const scaleLabel = document.createElement('span');
  scaleLabel.className = 'scale-label';
  scaleLabel.textContent = '大小';
  scaleDiv.appendChild(scaleLabel);

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.className = 'scale-slider';
  slider.min = '0.5';
  slider.max = '1.8';
  slider.step = '0.05';
  slider.value = (state.logoHalfSize / 0.88).toFixed(2);

  const valueLabel = document.createElement('span');
  valueLabel.className = 'scale-value';
  valueLabel.textContent = (state.logoHalfSize / 0.88).toFixed(1) + 'x';

  slider.addEventListener('input', (e) => {
    const mult = parseFloat(e.target.value);
    valueLabel.textContent = mult.toFixed(1) + 'x';
    state.logoHalfSize = 0.88 * mult;
    const newGeo = buildLogoGeometry(state.logoHalfSize);
    logoMesh.geometry.dispose();
    logoMesh.geometry = newGeo;
  });

  scaleDiv.appendChild(slider);
  scaleDiv.appendChild(valueLabel);
  div.appendChild(scaleDiv);

  const toggleRow = document.createElement('div');
  toggleRow.style.marginTop = '14px';
  toggleRow.style.display = 'flex';
  toggleRow.style.alignItems = 'center';
  toggleRow.style.gap = '10px';

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'top-btn' + (state.logoVisible ? ' accent' : '');
  toggleBtn.style.padding = '6px 16px';
  toggleBtn.innerHTML = state.logoVisible ? '👁️ 显示中' : '🙈 已隐藏';
  toggleBtn.addEventListener('click', () => {
    state.logoVisible = !state.logoVisible;
    logoMesh.visible = state.logoVisible;
    toggleBtn.className = 'top-btn' + (state.logoVisible ? ' accent' : '');
    toggleBtn.innerHTML = state.logoVisible ? '👁️ 显示中' : '🙈 已隐藏';
  });
  toggleRow.appendChild(toggleBtn);
  div.appendChild(toggleRow);

  itemArea.appendChild(div);
}

function renderAccessoryGrid(cat) {
  const grid = document.createElement('div');
  grid.className = 'item-grid';

  cat.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    const isActive = state.activeAccessories[cat.id] === item.id;
    if (isActive) card.classList.add('active');

    card.innerHTML = `
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
    `;

    card.addEventListener('click', () => {
      toggleAccessory(cat.id, item.id);
      renderItemArea();
    });

    grid.appendChild(card);
  });

  itemArea.appendChild(grid);

  if (cat.hasScale) {
    const currentScale = state.accessoryScales[cat.id] || cat.defaultScale || 1;

    const scaleDiv = document.createElement('div');
    scaleDiv.className = 'scale-control';

    const scaleLabel = document.createElement('span');
    scaleLabel.className = 'scale-label';
    scaleLabel.textContent = '大小';
    scaleDiv.appendChild(scaleLabel);

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'scale-slider';
    slider.min = '0.5';
    slider.max = '2.5';
    slider.step = '0.1';
    slider.value = currentScale;

    const valueLabel = document.createElement('span');
    valueLabel.className = 'scale-value';
    valueLabel.textContent = currentScale.toFixed(1) + 'x';

    slider.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      valueLabel.textContent = s.toFixed(1) + 'x';
      setAccessoryScale(cat.id, s);
    });

    scaleDiv.appendChild(slider);
    scaleDiv.appendChild(valueLabel);
    itemArea.appendChild(scaleDiv);
  }
}

/* ============================================================
   10. 随机 / 重置 / 保存
   ============================================================ */
function randomOutfit() {
  const skin = COLOR_PRESETS.skin[Math.floor(Math.random() * COLOR_PRESETS.skin.length)];
  state.skinColor = skin.color;
  matSkin.color.setHex(skin.color);

  const blushOptions = COLOR_PRESETS.blush.filter(b => b.color !== null);
  const blush = blushOptions[Math.floor(Math.random() * blushOptions.length)];
  if (Math.random() > 0.2) {
    state.blushEnabled = true;
    state.blushColor = blush.color;
    matBlush.color.setHex(blush.color);
    blushMeshes.forEach(b => b.visible = true);
  } else {
    state.blushEnabled = false;
    blushMeshes.forEach(b => b.visible = false);
  }

  clearAllAccessories();

  ACCESSORY_CATEGORIES.forEach(cat => {
    if (cat.items && Math.random() > 0.4) {
      const item = cat.items[Math.floor(Math.random() * cat.items.length)];
      if (cat.id === 'hats' && state.activeAccessories['plants']) {
        const pg = activeAccessoryGroups['plants'];
        if (pg) pg.visible = false;
        delete state.activeAccessories['plants'];
        delete activeAccessoryGroups['plants'];
      }
      if (cat.id === 'plants' && state.activeAccessories['hats']) {
        const hg = activeAccessoryGroups['hats'];
        if (hg) hg.visible = false;
        delete state.activeAccessories['hats'];
        delete activeAccessoryGroups['hats'];
      }
      toggleAccessory(cat.id, item.id);
    }
  });

  renderItemArea();
  buildCategoryTabs();
}

function resetOutfit() {
  state.skinColor = 0xfff0e4;
  state.logoColor = '#4a3f3a';
  state.logoVisible = true;
  state.logoHalfSize = 0.88;
  state.blushEnabled = true;
  state.blushColor = 0xffb0a0;

  matSkin.color.setHex(state.skinColor);
  matBlush.color.setHex(state.blushColor);
  matLogo.map = createLogoTexture(state.logoColor);
  matLogo.needsUpdate = true;
  logoMesh.visible = true;
  const newGeo = buildLogoGeometry(0.88);
  logoMesh.geometry.dispose();
  logoMesh.geometry = newGeo;
  blushMeshes.forEach(b => b.visible = true);

  Object.keys(state.accessoryScales).forEach(k => {
    state.accessoryScales[k] = (k === 'ears' || k === 'plants') ? 1.3 : 1.0;
    setAccessoryScale(k, state.accessoryScales[k]);
  });

  clearAllAccessories();
  renderItemArea();
  buildCategoryTabs();
}

function saveOutfit() {
  const data = {
    skin: state.skinColor,
    logo: state.logoColor,
    logoVisible: state.logoVisible,
    logoHalfSize: state.logoHalfSize,
    blushEnabled: state.blushEnabled,
    blushColor: state.blushColor,
    accessories: { ...state.activeAccessories },
    accessoryScales: { ...state.accessoryScales },
  };
  try {
    localStorage.setItem('gpt-doll-outfit-v4', JSON.stringify(data));
    const btn = document.getElementById('btn-save');
    const orig = btn.innerHTML;
    btn.innerHTML = '<span>✅</span><span class="btn-text">已保存</span>';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  } catch (e) {
    console.warn('保存失败:', e);
  }
}

function loadOutfit() {
  try {
    const raw = localStorage.getItem('gpt-doll-outfit-v4');
    if (!raw) return false;
    const data = JSON.parse(raw);

    state.skinColor = data.skin || 0xfff0e4;
    state.logoColor = data.logo || '#4a3f3a';
    state.logoVisible = data.logoVisible !== false;
    state.logoHalfSize = data.logoHalfSize || 0.88;
    state.blushEnabled = data.blushEnabled !== false;
    state.blushColor = data.blushColor || 0xffb0a0;

    matSkin.color.setHex(state.skinColor);
    matBlush.color.setHex(state.blushColor);
    matLogo.map = createLogoTexture(state.logoColor);
    matLogo.needsUpdate = true;
    logoMesh.visible = state.logoVisible;
    const newGeo = buildLogoGeometry(state.logoHalfSize);
    logoMesh.geometry.dispose();
    logoMesh.geometry = newGeo;
    blushMeshes.forEach(b => b.visible = state.blushEnabled);

    if (data.accessoryScales) {
      Object.assign(state.accessoryScales, data.accessoryScales);
    }

    clearAllAccessories();
    if (data.accessories) {
      Object.entries(data.accessories).forEach(([catId, itemId]) => {
        const group = createAccessory(itemId, catId);
        if (group) {
          const scale = state.accessoryScales[catId] || 1;
          applyScaleToGroup(group, scale);
          group.visible = true;
          state.activeAccessories[catId] = itemId;
          activeAccessoryGroups[catId] = group;
        }
      });
    }

    return true;
  } catch (e) {
    console.warn('读取保存失败:', e);
    return false;
  }
}

/* ============================================================
   11. 事件绑定
   ============================================================ */
document.getElementById('btn-random').addEventListener('click', randomOutfit);
document.getElementById('btn-reset').addEventListener('click', resetOutfit);
document.getElementById('btn-save').addEventListener('click', saveOutfit);

/* 面板折叠 / 展开 */
const panelEl = document.getElementById('panel');
const togglePanelBtn = document.getElementById('toggle-panel');
const collapseBtn = document.getElementById('panel-collapse');

function setPanelCollapsed(collapsed) {
  if (collapsed) {
    panelEl.classList.add('hidden');
    togglePanelBtn.classList.add('visible');
  } else {
    panelEl.classList.remove('hidden');
    togglePanelBtn.classList.remove('visible');
  }
  try { localStorage.setItem('gpt-doll-panel-collapsed', collapsed ? '1' : '0'); } catch(e) {}
}

collapseBtn.addEventListener('click', () => setPanelCollapsed(true));
togglePanelBtn.addEventListener('click', () => setPanelCollapsed(false));

// 恢复上次的折叠状态
try {
  if (localStorage.getItem('gpt-doll-panel-collapsed') === '1') {
    setPanelCollapsed(true);
  }
} catch(e) {}

/* ============================================================
   12. 控制器
   ============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0.5, -0.3, 0.5);
controls.minDistance = 3.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.82;
controls.update();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   13. 动画
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  dollGroup.rotation.z = Math.sin(t * 1.0) * 0.014;
  dollGroup.rotation.x = Math.sin(t * 0.7) * 0.008 + Math.sin(t * 1.5) * 0.003;

  armMeshes.forEach(arm => {
    const side = arm.userData.side;
    const baseRot = arm.userData.baseRotZ;
    arm.rotation.z = baseRot + Math.sin(t * 1.3 + side * 0.5) * 0.02;
  });

  curtains.forEach(c => {
    c.rotation.y = c.userData.baseRotY + Math.sin(t * 0.8 + c.position.x) * 0.03;
  });

  windowClouds.forEach(cloud => {
    cloud.position.x = cloud.userData.baseX + Math.sin(t * 0.15 + cloud.userData.baseX) * 0.1;
  });

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   14. 启动
   ============================================================ */
function init() {
  buildCategoryTabs();
  renderItemArea();

  const loaded = loadOutfit();

  if (!loaded) {
    matSkin.color.setHex(state.skinColor);
    matBlush.color.setHex(state.blushColor);
    blushMeshes.forEach(b => b.visible = true);
  }

  setTimeout(() => {
    document.getElementById('loading').classList.add('done');
  }, 400);

  animate();
}

init();
</script>
